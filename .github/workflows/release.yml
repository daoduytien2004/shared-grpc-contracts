name: Release gRPC Contracts


on:

  push:

    tags:

      - "v*.*.*"


permissions:

  contents: read


jobs:

  # ==========================================================
  # VALIDATE
  # ==========================================================

  validate:

    name: Validate Proto

    runs-on: ubuntu-latest


    steps:

      - name: Checkout

        uses: actions/checkout@v7


      - name: Validate tag

        shell: bash

        run: |

          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then

            echo "Invalid release tag: ${GITHUB_REF_NAME}"

            echo "Expected format: vMAJOR.MINOR.PATCH"

            exit 1

          fi


      - name: Install protoc

        shell: bash

        run: |

          sudo apt-get update

          sudo apt-get install -y protobuf-compiler


      - name: Validate proto

        shell: bash

        run: |

          set -euo pipefail

          mapfile -d '' PROTO_FILES \
            < <(find proto -type f -name '*.proto' -print0)

          if [ "${#PROTO_FILES[@]}" -eq 0 ]; then

            echo "No .proto files found"

            exit 1

          fi

          protoc \
            --proto_path=proto \
            --descriptor_set_out=/tmp/shared-contracts.pb \
            --include_imports \
            "${PROTO_FILES[@]}"


  # ==========================================================
  # MAVEN CENTRAL
  # ==========================================================

  publish-maven:

    name: Publish Maven Central

    needs: validate

    runs-on: ubuntu-latest


    steps:

      - name: Checkout

        uses: actions/checkout@v7


      - name: Setup Java

        uses: actions/setup-java@v6

        with:

          distribution: temurin

          java-version: "17"

          server-id: central

          server-username-env-var: MAVEN_USERNAME

          server-password-env-var: MAVEN_PASSWORD

          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

          gpg-passphrase-env-var: GPG_PASSPHRASE


      - name: Set Maven version

        shell: bash

        run: |

          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          echo "Maven version: ${VERSION}"

          mvn \
            -f packaging/maven/pom.xml \
            versions:set \
            -DnewVersion="${VERSION}" \
            -DgenerateBackupPoms=false \
            --batch-mode \
            --no-transfer-progress


      - name: Verify Maven version

        shell: bash

        run: |

          mvn \
            -f packaging/maven/pom.xml \
            help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout


      - name: Publish Maven Central

        shell: bash

        env:

          MAVEN_USERNAME:
            ${{ secrets.MAVEN_USERNAME }}

          MAVEN_PASSWORD:
            ${{ secrets.MAVEN_PASSWORD }}

          GPG_PASSPHRASE:
            ${{ secrets.GPG_PASSPHRASE }}

        run: |

          set -euo pipefail

          mvn \
            -f packaging/maven/pom.xml \
            --batch-mode \
            --no-transfer-progress \
            deploy


  # ==========================================================
  # NPM
  # ==========================================================

  publish-npm:

    name: Publish npm

    needs: validate

    runs-on: ubuntu-latest


    permissions:

      contents: read

      id-token: write


    steps:

      - name: Checkout

        uses: actions/checkout@v7


      - name: Setup Node.js

        uses: actions/setup-node@v7

        with:

          node-version: "24"

          registry-url: "https://registry.npmjs.org"

          package-manager-cache: false


      - name: Update npm

        run: npm install --global npm@latest


      - name: Prepare npm package

        shell: bash

        run: |

          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          echo "npm version: ${VERSION}"

          rm -rf packaging/npm/proto

          cp -R proto packaging/npm/proto

          cd packaging/npm

          npm pkg set version="${VERSION}"


      - name: Inspect npm package

        working-directory: packaging/npm

        run: npm pack --dry-run


      - name: Publish npm

        working-directory: packaging/npm

        run: npm publish --access public


  # ==========================================================
  # PYPI
  # ==========================================================

  publish-pypi:

    name: Publish PyPI

    needs: validate

    runs-on: ubuntu-latest


    environment:

      name: pypi


    permissions:

      contents: read

      id-token: write


    steps:

      - name: Checkout

        uses: actions/checkout@v7


      - name: Setup Python

        uses: actions/setup-python@v7

        with:

          python-version: "3.13"


      - name: Install build tools

        run: |

          python -m pip install --upgrade build


      - name: Prepare Python package

        shell: bash

        run: |

          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          echo "PyPI version: ${VERSION}"

          rm -rf \
            packaging/python/src \
            packaging/python/dist \
            packaging/python/build

          mkdir -p \
            packaging/python/src/shared_grpc_contracts/proto

          cp -R proto/. \
            packaging/python/src/shared_grpc_contracts/proto/

          sed -i \
            "s/version = \"0.0.0\"/version = \"${VERSION}\"/" \
            packaging/python/pyproject.toml


      - name: Build Python package

        working-directory: packaging/python

        run: python -m build


      - name: Inspect Python package

        shell: bash

        run: |

          ls -lah packaging/python/dist

          python -m zipfile \
            -l packaging/python/dist/*.whl


      - name: Publish PyPI

        uses: pypa/gh-action-pypi-publish@release/v1

        with:

          packages-dir: packaging/python/dist/