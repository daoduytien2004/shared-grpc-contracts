[build-system]

requires = [
    "setuptools>=77",
    "wheel"
]

build-backend = "setuptools.build_meta"


[project]

name = "shared-grpc-contracts"

version = "0.0.0"

description = "Shared gRPC Protocol Buffer contracts"

requires-python = ">=3.10"

license = "MIT"

authors = [
    { name = "lean2708" }
]


[project.urls]

Homepage = "https://github.com/daoduytien2004/shared-grpc-contracts"

Repository = "https://github.com/daoduytien2004/shared-grpc-contracts"

Issues = "https://github.com/daoduytien2004/shared-grpc-contracts/issues"


[tool.setuptools]

include-package-data = true


[tool.setuptools.packages.find]

where = ["src"]

namespaces = true


[tool.setuptools.package-data]

"*" = [
    "*.proto"
]